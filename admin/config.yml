collections:
    - name: "recipes"
      label: "מתכונים"
      folder: "data/recipes"
      create: false # ביטול יצירת קבצים חדשים
      identifier_field: "id"
      format: "json"
      file: "data/recipes/recipes.json" # זה הופך את זה ל-singleton
      fields:
        - label: "רשימת מתכונים"
          name: "recipes"
          widget: "list"
          fields:
            - { label: "מזהה", name: "id", widget: "number" }
            - { label: "שם", name: "title", widget: "string" }
            - { label: "תמונה", name: "image", widget: "image" }
            - { label: "מצרכים", name: "ingredients", widget: "list", field: { label: "מצרך", name: "item", widget: "string" } }
            - { label: "הכנה", name: "instructions", widget: "text" }
