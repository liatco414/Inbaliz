<!doctype html>
<html lang="he" dir="rtl">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>מערכת ניהול תוכן - Inbali’z</title>
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Assistant', sans-serif;
        }
        body {
            background-color: #f4f6f9;
            color: #333;
            padding: 20px;
        }
        .admin-container {
            max-width: 750px;
            margin: 40px auto;
            background: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        h1 {
            text-align: center;
            margin-bottom: 25px;
            color: #2c3e50;
        }
        .tabs {
            display: flex;
            justify-content: center;
            margin-bottom: 25px;
            gap: 10px;
            flex-wrap: wrap;
        }
        .tab-btn {
            padding: 10px 20px;
            border: none;
            background: #e0e0e0;
            cursor: pointer;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            transition: 0.3s;
        }
        .tab-btn.active {
            background: #3498db;
            color: #fff;
        }
        .form-section {
            display: none;
        }
        .form-section.active {
            display: block;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: #555;
        }
        input[type="text"],
        input[type="number"],
        input[type="file"],
        textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 15px;
        }
        textarea {
            resize: vertical;
            height: 100px;
        }
        .ingredient-row {
            display: flex;
            gap: 8px;
            margin-bottom: 8px;
            align-items: center;
        }
        .ingredient-row input {
            flex: 1;
        }
        .action-btn {
            background: #3498db;
            color: white;
            border: none;
            width: 38px;
            height: 38px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 18px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .action-btn.remove {
            background: #e74c3c;
        }
        .action-btn.add {
            background: #2ecc71;
        }
        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .checkbox-group input {
            width: 18px;
            height: 18px;
        }
        button.submit-btn {
            width: 100%;
            padding: 12px;
            background: #2ecc71;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 15px;
        }
        button.submit-btn:hover {
            background: #27ae60;
        }
        button.cancel-edit-btn {
            width: 100%;
            padding: 8px;
            background: #e74c3c;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            cursor: pointer;
            margin-top: 8px;
            display: none;
        }
        #status-message {
            margin-top: 15px;
            text-align: center;
            font-weight: 600;
        }
        .items-list {
            margin-top: 20px;
            border-top: 2px solid #eee;
            padding-top: 20px;
        }
        .item-card {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #f9f9f9;
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 10px;
            border: 1px solid #e5e5e5;
        }
        .item-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .item-info img {
            width: 45px;
            height: 45px;
            object-fit: cover;
            border-radius: 6px;
        }
        .item-actions {
            display: flex;
            gap: 8px;
        }
        .edit-item-btn {
            background: #f39c12;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
        }
        .delete-item-btn {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="admin-container">
        <h1>ניהול מוצרים ומתכונים</h1>
        
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('products')">הוספת/ניהול מוצרים</button>
            <button class="tab-btn" onclick="switchTab('recipes')">הוספת/ניהול מתכונים</button>
        </div>

        <!-- טופס מוצרים -->
        <div id="products-section" class="form-section active">
            <h3 id="product-form-title" style="margin-bottom: 15px; color: #34495e;">הוספת מוצר חדש</h3>
            <form id="product-form" onsubmit="saveItem(event, 'products')">
                <input type="hidden" id="prod-edit-filename">
                <input type="hidden" id="prod-edit-sha">
                <input type="hidden" id="prod-existing-img">
                
                <div class="form-group">
                    <label>שם המוצר</label>
                    <input type="text" id="prod-name" required>
                </div>
                <div class="form-group">
                    <label>תיאור</label>
                    <textarea id="prod-desc" required></textarea>
                </div>
                <div class="form-group">
                    <label>מחיר (לדוגמה: ₪45)</label>
                    <input type="text" id="prod-price" required>
                </div>
                <div class="form-group">
                    <label>העלאת תמונה (השאר ריק אם אין צורך לשנות בעריכה)</label>
                    <input type="file" id="prod-img" accept="image/*">
                </div>
                <div class="form-group checkbox-group">
                    <input type="checkbox" id="prod-stock" checked>
                    <label for="prod-stock">במלאי</label>
                </div>
                <button type="submit" id="prod-submit-btn" class="submit-btn">שמור מוצר</button>
                <button type="button" id="prod-cancel-btn" class="cancel-edit-btn" onclick="cancelEdit('products')">ביטול עריכה</button>
            </form>

            <div class="items-list">
                <h4 style="margin-bottom: 10px;">מוצרים קיימים במערכת:</h4>
                <div id="products-list-container">טוען מוצרים...</div>
            </div>
        </div>

        <!-- טופס מתכונים -->
        <div id="recipes-section" class="form-section">
            <h3 id="recipe-form-title" style="margin-bottom: 15px; color: #34495e;">הוספת מתכון חדש</h3>
            <form id="recipe-form" onsubmit="saveItem(event, 'recipes')">
                <input type="hidden" id="rec-edit-filename">
                <input type="hidden" id="rec-edit-sha">
                <input type="hidden" id="rec-existing-img">

                <div class="form-group">
                    <label>שם המתכון</label>
                    <input type="text" id="rec-title" required>
                </div>
                <div class="form-group">
                    <label>העלאת תמונה (השאר ריק אם אין צורך לשנות בעריכה)</label>
                    <input type="file" id="rec-img" accept="image/*">
                </div>
                <div class="form-group">
                    <label>מצרכים</label>
                    <div id="ingredients-container">
                        <div class="ingredient-row">
                            <input type="text" class="ingredient-input" placeholder="לדוגמה: 500 מ&quot;ל שמנת מתוקה" required>
                            <button type="button" class="action-btn add" onclick="addIngredientRow(this)" title="הוסף שורה">+</button>
                        </div>
                    </div>
                </div>
                <div class="form-group">
                    <label>אופן הכנה</label>
                    <textarea id="rec-instructions" required></textarea>
                </div>
                <button type="submit" id="rec-submit-btn" class="submit-btn">שמור מתכון</button>
                <button type="button" id="rec-cancel-btn" class="cancel-edit-btn" onclick="cancelEdit('recipes')">ביטול עריכה</button>
            </form>

            <div class="items-list">
                <h4 style="margin-bottom: 10px;">מתכונים קיימים במערכת:</h4>
                <div id="recipes-list-container">טוען מתכונים...</div>
            </div>
        </div>

        <div id="status-message"></div>
    </div>

    <script>
        const GITHUB_TOKEN = "YOUR_GITHUB_PERSONAL_ACCESS_TOKEN"; 
        const REPO_OWNER = "YOUR_GITHUB_USERNAME";
        const REPO_NAME = "YOUR_REPO_NAME";
        const BRANCH = "main";

        // טעינת רשימות בעלייה
        window.onload = () => {
            loadItemsList('products');
            loadItemsList('recipes');
        };

        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.form-section').forEach(sec => sec.classList.remove('active'));

            if (tab === 'products') {
                document.querySelectorAll('.tab-btn')[0].classList.add('active');
                document.getElementById('products-section').classList.add('active');
            } else {
                document.querySelectorAll('.tab-btn')[1].classList.add('active');
                document.getElementById('recipes-section').classList.add('active');
            }
        }

        // טעינת רשימת פריטים מגיטהאב
        async function loadItemsList(type) {
            const containerId = type === 'products' ? 'products-list-container' : 'recipes-list-container';
            const container = document.getElementById(containerId);
            const folderPath = `data/${type}`;

            try {
                const response = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${folderPath}`, {
                    headers: { "Authorization": `token ${GITHUB_TOKEN}` }
                });

                if (!response.ok) {
                    container.innerHTML = "אין פריטים קיימים או תיקייה ריקה.";
                    return;
                }

                const files = await response.json();
                const jsonFiles = files.filter(f => f.name.endsWith('.json'));

                if (jsonFiles.length === 0) {
                    container.innerHTML = "אין פריטים עדיין.";
                    return;
                }

                container.innerHTML = "";
                for (let file of jsonFiles) {
                    const fileContentRes = await fetch(file.download_url);
                    const data = await fileContentRes.json();
                    const itemName = type === 'products' ? data.name : data.title;
                    const itemImg = data.image ? data.image.replace('./', '') : '';

                    const card = document.createElement("div");
                    card.className = "item-card";
                    card.innerHTML = `
                        <div class="item-info">
                            ${itemImg ? `<img src="../${itemImg}" onerror="this.src='https://via.placeholder.com/45'">` : ''}
                            <span><strong>${itemName}</strong></span>
                        </div>
                        <div class="item-actions">
                            <button class="item-btn edit-item-btn" onclick='prepareEdit("${type}", ${JSON.stringify(file.name)}, ${JSON.stringify(file.sha)})'>עריכה</button>
                            <button class="item-btn delete-item-btn" onclick='deleteItem("${type}", ${JSON.stringify(file.name)}, ${JSON.stringify(file.sha)}, ${JSON.stringify(data.image)})'>מחיקה</button>
                        </div>
                    `;
                    container.appendChild(card);
                }
            } catch (err) {
                container.innerHTML = "שגיאה בטעינת הרשימה.";
            }
        }

        // ניהול שורות מצרכים
        function addIngredientRow(button, value = "") {
            button.className = "action-btn remove";
            button.textContent = "-";
            button.setAttribute("onclick", "removeIngredientRow(this)");

            const container = document.getElementById("ingredients-container");
            const newRow = document.createElement("div");
            newRow.className = "ingredient-row";
            newRow.innerHTML = `
                <input type="text" class="ingredient-input" value="${value}" placeholder="הכנס מצרך נוסף">
                <button type="button" class="action-btn add" onclick="addIngredientRow(this)" title="הוסף שורה">+</button>
            `;
            container.appendChild(newRow);
        }

        function removeIngredientRow(button) {
            button.parentElement.remove();
        }

        function fileToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result.split(',')[1]);
                reader.onerror = error => reject(error);
            });
        }

        async function uploadImageToGitHub(fileInputId) {
            const fileInput = document.getElementById(fileInputId);
            if (!fileInput.files[0]) return null;

            const file = fileInput.files[0];
            const base64Content = await fileToBase64(file);
            const imageName = `${Date.now()}-${file.name.replace(/\s+/g, '-')}`;
            const imagePath = `images/${imageName}`;

            const response = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${imagePath}`, {
                method: "PUT",
                headers: {
                    "Authorization": `token ${GITHUB_TOKEN}`,
                    "Content-Type": "application/json",
                },
                body: JSON.stringify({
                    message: `Upload image ${imageName} via admin panel`,
                    content: base64Content,
                    branch: BRANCH
                })
            });

            if (!response.ok) throw new Error("Failed to upload image");
            return imagePath;
        }

        // הכנה לעריכת פריט קיים
        async function prepareEdit(type, fileName, sha) {
            const statusDiv = "טוען נתונים לעריכה...";
            const folderPath = `data/${type}/${fileName}`;
            
            const res = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${folderPath}`, {
                headers: { "Authorization": `token ${GITHUB_TOKEN}` }
            });
            const fileDataJson = await res.json();
            const content = JSON.parse(decodeURIComponent(escape(atob(fileDataJson.content))));

            if (type === 'products') {
                document.getElementById('prod-edit-filename').value = fileName;
                document.getElementById('prod-edit-sha').value = sha;
                document.getElementById('prod-existing-img').value = content.image;
                document.getElementById('prod-name').value = content.name;
                document.getElementById('prod-desc').value = content.description;
                document.getElementById('prod-price').value = content.price;
                document.getElementById('prod-stock').checked = content.inStock;

                document.getElementById('product-form-title').textContent = "עריכת מוצר קיים";
                document.getElementById('prod-submit-btn').textContent = "עדכן מוצר";
                document.getElementById('prod-cancel-btn').style.display = "block";
                window.scrollTo({ top: 0, behavior: 'smooth' });
            } else {
                document.getElementById('rec-edit-filename').value = fileName;
                document.getElementById('rec-edit-sha').value = sha;
                document.getElementById('rec-existing-img').value = content.image;
                document.getElementById('rec-title').value = content.title;
                document.getElementById('rec-instructions').value = content.instructions;

                // טעינת מצרכים
                const container = document.getElementById("ingredients-container");
                container.innerHTML = "";
                if (content.ingredients && content.ingredients.length > 0) {
                    content.ingredients.forEach((ing, index) => {
                        const row = document.createElement("div");
                        row.className = "ingredient-row";
                        const isLast = index === content.ingredients.length - 1;
                        row.innerHTML = `
                            <input type="text" class="ingredient-input" value="${ing}" placeholder="הכנס מצרך">
                            <button type="button" class="action-btn ${isLast ? 'add' : 'remove'}" onclick="${isLast ? 'addIngredientRow(this)' : 'removeIngredientRow(this)'}" title="${isLast ? 'הוסף שורה' : 'מחק'}">${isLast ? '+' : '-'}</button>
                        `;
                        container.appendChild(row);
                    });
                }

                document.getElementById('recipe-form-title').textContent = "עריכת מתכון קיים";
                document.getElementById('rec-submit-btn').textContent = "עדכן מתכון";
                document.getElementById('rec-cancel-btn').style.display = "block";
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        function cancelEdit(type) {
            if (type === 'products') {
                document.getElementById('product-form').reset();
                document.getElementById('prod-edit-filename').value = "";
                document.getElementById('prod-edit-sha').value = "";
                document.getElementById('product-form-title').textContent = "הוספת מוצר חדש";
                document.getElementById('prod-submit-btn').textContent = "שמור מוצר";
                document.getElementById('prod-cancel-btn').style.display = "none";
            } else {
                document.getElementById('recipe-form').reset();
                document.getElementById('rec-edit-filename').value = "";
                document.getElementById('rec-edit-sha').value = "";
                document.getElementById('recipe-form-title').textContent = "הוספת מתכון חדש";
                document.getElementById('rec-submit-btn').textContent = "שמור מתכון";
                document.getElementById('rec-cancel-btn').style.display = "none";
                document.getElementById("ingredients-container").innerHTML = `
                    <div class="ingredient-row">
                        <input type="text" class="ingredient-input" placeholder="לדוגמה: 500 מ&quot;ל שמנת מתוקה" required>
                        <button type="button" class="action-btn add" onclick="addIngredientRow(this)" title="הוסף שורה">+</button>
                    </div>
                `;
            }
        }

        // מחיקת פריט
        async function deleteItem(type, fileName, sha, imagePath) {
            if (!confirm("האם את בטוחה שאת רוצה למחוק את הפריט לצמיתות?")) return;
            const statusDiv = document.getElementById("status-message");
            statusDiv.style.color = "#333";
            statusDiv.textContent = "מוחק פריט...";

            try {
                // מחיקת קובץ ה-JSON
                await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/data/${type}/${fileName}`, {
                    method: "DELETE",
                    headers: {
                        "Authorization": `token ${GITHUB_TOKEN}`,
                        "Content-Type": "application/json",
                    },
                    body: JSON.stringify({ message: `Delete ${fileName}`, sha: sha, branch: BRANCH })
                });

                // מחיקת תמונה קשורה אם קיימת
                if (imagePath) {
                    const cleanImgPath = imagePath.replace('./', '');
                    const imgRes = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${cleanImgPath}`, {
                        headers: { "Authorization": `token ${GITHUB_TOKEN}` }
                    });
                    if (imgRes.ok) {
                        const imgData = await imgRes.json();
                        await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${cleanImgPath}`, {
                            method: "DELETE",
                            headers: {
                                "Authorization": `token ${GITHUB_TOKEN}`,
                                "Content-Type": "application/json",
                            },
                            body: JSON.stringify({ message: `Delete image for ${fileName}`, sha: imgData.sha, branch: BRANCH })
                        });
                    }
                }

                statusDiv.style.color = "green";
                statusDiv.textContent = "הפריט נמחק בהצלחה!";
                loadItemsList(type);
            } catch (err) {
                statusDiv.style.color = "red";
                statusDiv.textContent = "שגיאה במחיקה: " + err.message;
            }
        }

        // שמירה או עדכון פריט
        async function saveItem(event, type) {
            event.preventDefault();
            const statusDiv = document.getElementById("status-message");
            statusDiv.style.color = "#333";
            statusDiv.textContent = "מעבד נתונים ושומר ל-GitHub...";

            try {
                const fileInputId = type === 'products' ? 'prod-img' : 'rec-img';
                let imagePath = await uploadImageToGitHub(fileInputId);
                
                const existingImg = document.getElementById(type === 'products' ? 'prod-existing-img' : 'rec-existing-img').value;
                if (!imagePath) {
                    imagePath = existingImg || "";
                } else {
                    imagePath = `./${imagePath}`;
                }

                let fileName = document.getElementById(type === 'products' ? 'prod-edit-filename' : 'rec-edit-filename').value;
                let sha = document.getElementById(type === 'products' ? 'prod-edit-sha' : 'rec-edit-sha').value;
                
                const isEditing = fileName !== "";
                if (!isEditing) {
                    fileName = `${type === 'products' ? 'product' : 'recipe'}-${Date.now()}.json`;
                }

                const folderPath = `data/${type}/${fileName}`;
                let fileData = {};

                if (type === 'products') {
                    fileData = {
                        name: document.getElementById("prod-name").value,
                        description: document.getElementById("prod-desc").value,
                        price: document.getElementById("prod-price").value,
                        image: imagePath,
                        inStock: document.getElementById("prod-stock").checked
                    };
                } else {
                    const ingredientInputs = document.querySelectorAll(".ingredient-input");
                    const ingredients = Array.from(ingredientInputs).map(input => input.value.trim()).filter(val => val !== "");

                    fileData = {
                        title: document.getElementById("rec-title").value,
                        image: imagePath,
                        ingredients: ingredients,
                        instructions: document.getElementById("rec-instructions").value
                    };
                }

                const contentEncoded = btoa(unescape(encodeURIComponent(JSON.stringify(fileData, null, 2))));
                
                let bodyPayload = {
                    message: `${isEditing ? 'Update' : 'Add'} ${type} via custom admin panel`,
                    content: contentEncoded,
                    branch: BRANCH
                };
                if (isEditing && sha) {
                    bodyPayload.sha = sha;
                }

                const response = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${folderPath}`, {
                    method: "PUT",
                    headers: {
                        "Authorization": `token ${GITHUB_TOKEN}`,
                        "Content-Type": "application/json",
                    },
                    body: JSON.stringify(bodyPayload)
                });

                if (response.ok) {
                    statusDiv.style.color = "green";
                    statusDiv.textContent = isEditing ? "הפריט עודכן בהצלחה! ✨" : "הפריט נוסף בהצלחה! ✨";
                    cancelEdit(type);
                    loadItemsList(type);
                } else {
                    const err = await response.json();
                    throw new Error(err.message || "Unknown error");
                }
            } catch (error) {
                statusDiv.style.color = "red";
                statusDiv.textContent = "שגיאה בשמירה: " + error.message;
            }
        }
    </script>
</body>
</html>
