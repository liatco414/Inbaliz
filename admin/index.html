<!doctype html>
<html lang="he" dir="rtl">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>מערכת ניהול תוכן - Inbali’z</title>
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Assistant', sans-serif;
        }
        body {
            background-color: #f4f6f9;
            color: #333;
            padding: 20px;
        }
        .admin-container {
            max-width: 650px;
            margin: 40px auto;
            background: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        h1 {
            text-align: center;
            margin-bottom: 25px;
            color: #2c3e50;
        }
        .tabs {
            display: flex;
            justify-content: center;
            margin-bottom: 25px;
            gap: 10px;
        }
        .tab-btn {
            padding: 10px 20px;
            border: none;
            background: #e0e0e0;
            cursor: pointer;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            transition: 0.3s;
        }
        .tab-btn.active {
            background: #3498db;
            color: #fff;
        }
        .form-section {
            display: none;
        }
        .form-section.active {
            display: block;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: #555;
        }
        input[type="text"],
        input[type="number"],
        input[type="file"],
        textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 15px;
        }
        textarea {
            resize: vertical;
            height: 100px;
        }
        .ingredient-row {
            display: flex;
            gap: 8px;
            margin-bottom: 8px;
            align-items: center;
        }
        .ingredient-row input {
            flex: 1;
        }
        .action-btn {
            background: #3498db;
            color: white;
            border: none;
            width: 38px;
            height: 38px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 18px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .action-btn.remove {
            background: #e74c3c;
        }
        .action-btn.add {
            background: #2ecc71;
        }
        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .checkbox-group input {
            width: 18px;
            height: 18px;
        }
        button.submit-btn {
            width: 100%;
            padding: 12px;
            background: #2ecc71;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 15px;
        }
        button.submit-btn:hover {
            background: #27ae60;
        }
        #status-message {
            margin-top: 15px;
            text-align: center;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="admin-container">
        <h1>ניהול מוצרים ומתכונים</h1>
        
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('products')">הוספת מוצר</button>
            <button class="tab-btn" onclick="switchTab('recipes')">הוספת מתכון</button>
        </div>

        <!-- טופס מוצרים -->
        <div id="products-section" class="form-section active">
            <form id="product-form" onsubmit="saveItem(event, 'products')">
                <div class="form-group">
                    <label>שם המוצר</label>
                    <input type="text" id="prod-name" required>
                </div>
                <div class="form-group">
                    <label>תיאור</label>
                    <textarea id="prod-desc" required></textarea>
                </div>
                <div class="form-group">
                    <label>מחיר (לדוגמה: ₪45)</label>
                    <input type="text" id="prod-price" required>
                </div>
                <div class="form-group">
                    <label>העלאת תמונה</label>
                    <input type="file" id="prod-img" accept="image/*" required>
                </div>
                <div class="form-group checkbox-group">
                    <input type="checkbox" id="prod-stock" checked>
                    <label for="prod-stock">במלאי</label>
                </div>
                <button type="submit" class="submit-btn">שמור מוצר</button>
            </form>
        </div>

        <!-- טופס מתכונים -->
        <div id="recipes-section" class="form-section">
            <form id="recipe-form" onsubmit="saveItem(event, 'recipes')">
                <div class="form-group">
                    <label>מזהה (מספר סידורי ייחודי, למשל: 1, 2...)</label>
                    <input type="number" id="rec-id" required>
                </div>
                <div class="form-group">
                    <label>שם המתכון</label>
                    <input type="text" id="rec-title" required>
                </div>
                <div class="form-group">
                    <label>העלאת תמונה</label>
                    <input type="file" id="rec-img" accept="image/*" required>
                </div>
                <div class="form-group">
                    <label>מצרכים</label>
                    <div id="ingredients-container">
                        <div class="ingredient-row">
                            <input type="text" class="ingredient-input" placeholder="לדוגמה: 500 מ&quot;ל שמנת מתוקה" required>
                            <button type="button" class="action-btn add" onclick="addIngredientRow(this)" title="הוסף שורה">+</button>
                        </div>
                    </div>
                </div>
                <div class="form-group">
                    <label>אופן הכנה</label>
                    <textarea id="rec-instructions" required></textarea>
                </div>
                <button type="submit" class="submit-btn">שמור מתכון</button>
            </form>
        </div>

        <div id="status-message"></div>
    </div>

    <script>
        const GITHUB_TOKEN = "YOUR_GITHUB_PERSONAL_ACCESS_TOKEN"; 
        const REPO_OWNER = "YOUR_GITHUB_USERNAME";
        const REPO_NAME = "YOUR_REPO_NAME";
        const BRANCH = "main";

        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.form-section').forEach(sec => sec.classList.remove('active'));

            if (tab === 'products') {
                document.querySelectorAll('.tab-btn')[0].classList.add('active');
                document.getElementById('products-section').classList.add('active');
            } else {
                document.querySelectorAll('.tab-btn')[1].classList.add('active');
                document.getElementById('recipes-section').classList.add('active');
            }
        }

        // ניהול שורות מצרכים דינמיות עם כפתור + ו- - צמודים
        function addIngredientRow(button) {
            // הופכים את הכפתור הנוכחי למינוס (-) כדי שיה אפשר למחוק את השורה הזו
            button.className = "action-btn remove";
            button.textContent = "-";
            button.setAttribute("onclick", "removeIngredientRow(this)");

            const container = document.getElementById("ingredients-container");
            const newRow = document.createElement("div");
            newRow.className = "ingredient-row";
            newRow.innerHTML = `
                <input type="text" class="ingredient-input" placeholder="הכנס מצרך נוסף">
                <button type="button" class="action-btn add" onclick="addIngredientRow(this)" title="הוסף שורה">+</button>
            `;
            container.appendChild(newRow);
        }

        function removeIngredientRow(button) {
            button.parentElement.remove();
        }

        function fileToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result.split(',')[1]);
                reader.onerror = error => reject(error);
            });
        }

        async function uploadImageToGitHub(fileInputId) {
            const fileInput = document.getElementById(fileInputId);
            if (!fileInput.files[0]) return null;

            const file = fileInput.files[0];
            const base64Content = await fileToBase64(file);
            const imageName = `${Date.now()}-${file.name.replace(/\s+/g, '-')}`;
            const imagePath = `images/${imageName}`;

            const response = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${imagePath}`, {
                method: "PUT",
                headers: {
                    "Authorization": `token ${GITHUB_TOKEN}`,
                    "Content-Type": "application/json",
                },
                body: JSON.stringify({
                    message: `Upload image ${imageName} via admin panel`,
                    content: base64Content,
                    branch: BRANCH
                })
            });

            if (!response.ok) {
                throw new Error("Failed to upload image to GitHub");
            }

            return imagePath;
        }

        async function saveItem(event, type) {
            event.preventDefault();
            const statusDiv = document.getElementById("status-message");
            statusDiv.style.color = "#333";
            statusDiv.textContent = "מעלה תמונה ושומר נתונים ל-GitHub...";

            try {
                const imagePath = await uploadImageToGitHub(type === 'products' ? 'prod-img' : 'rec-img');
                
                let fileName, fileData, folderPath;
                const uniqueId = Date.now();

                if (type === 'products') {
                    const name = document.getElementById("prod-name").value;
                    const description = document.getElementById("prod-desc").value;
                    const price = document.getElementById("prod-price").value;
                    const inStock = document.getElementById("prod-stock").checked;

                    fileName = `product-${uniqueId}.json`;
                    folderPath = `data/products/${fileName}`;
                    fileData = { name, description, price, image: `./${imagePath}`, inStock };
                } else {
                    const id = Number(document.getElementById("rec-id").value);
                    const title = document.getElementById("rec-title").value;
                    const instructions = document.getElementById("rec-instructions").value;

                    // איסוף כל שורות המצרכים למערך מחרוזות נקי
                    const ingredientInputs = document.querySelectorAll(".ingredient-input");
                    const ingredients = Array.from(ingredientInputs).map(input => input.value.trim()).filter(val => val !== "");

                    fileName = `recipe-${uniqueId}.json`;
                    folderPath = `data/recipes/${fileName}`;
                    fileData = { id, title, image: `./${imagePath}`, ingredients, instructions };
                }

                const contentEncoded = btoa(unescape(encodeURIComponent(JSON.stringify(fileData, null, 2))));

                const response = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${folderPath}`,{
                    method: "PUT",
                    headers: {
                        "Authorization": `token ${GITHUB_TOKEN}`,
                        "Content-Type": "application/json",
                    },
                    body: JSON.stringify({
                        message: `Add new ${type} and image via custom admin panel`,
                        content: contentEncoded,
                        branch: BRANCH
                    })
                });

                if (response.ok) {
                    statusDiv.style.color = "green";
                    statusDiv.textContent = "הפריט והתמונה הועלו בהצלחה ונשמרו ב-GitHub! ✨";
                    event.target.reset();
                    // איפוס שורות המצרכים למצרך בודד התחלתי עם כפתור +
                    document.getElementById("ingredients-container").innerHTML = `
                        <div class="ingredient-row">
                            <input type="text" class="ingredient-input" placeholder="לדוגמה: 500 מ&quot;ל שמנת מתוקה" required>
                            <button type="button" class="action-btn add" onclick="addIngredientRow(this)" title="הוסף שורה">+</button>
                        </div>
                    `;
                } else {
                    const err = await response.json();
                    throw new Error(err.message || "Unknown error");
                }
            } catch (error) {
                statusDiv.style.color = "red";
                statusDiv.textContent = "שגיאה בשמירה: " + error.message;
            }
        }
    </script>
</body>
</html>
