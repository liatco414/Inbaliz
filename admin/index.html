<!doctype html>
<html lang="he" dir="rtl">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>מערכת ניהול תוכן - Inbali’z</title>
        <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700&display=swap" rel="stylesheet" />
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
        <style>
            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
                font-family: "Assistant", sans-serif;
            }
            body {
                background-color: #f4f6f9;
                color: #333;
                padding: 20px;
            }
            .admin-container {
                max-width: 750px;
                margin: 40px auto;
                background: #fff;
                padding: 30px;
                border-radius: 12px;
                box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            }
            h1 {
                text-align: center;
                margin-bottom: 25px;
                color: #2c3e50;
            }
            .tabs {
                display: flex;
                justify-content: center;
                margin-bottom: 25px;
                gap: 10px;
            }
            .tab-btn {
                padding: 10px 20px;
                border: none;
                background: #e0e0e0;
                cursor: pointer;
                border-radius: 8px;
                font-size: 16px;
                font-weight: 600;
                transition: 0.3s;
            }
            .tab-btn.active {
                background: #3498db;
                color: #fff;
            }
            .form-section {
                display: none;
            }
            .form-section.active {
                display: block;
            }
            .form-group {
                margin-bottom: 15px;
            }
            label {
                display: block;
                margin-bottom: 5px;
                font-weight: 600;
                color: #555;
            }
            input[type="text"],
            input[type="number"],
            input[type="file"],
            input[type="password"],
            textarea {
                width: 100%;
                padding: 10px;
                border: 1px solid #ddd;
                border-radius: 6px;
                font-size: 15px;
            }
            textarea {
                resize: vertical;
                height: 100px;
            }
            .ingredient-row {
                display: flex;
                gap: 8px;
                margin-bottom: 8px;
                align-items: center;
            }
            .ingredient-row input {
                flex: 1;
            }
            .action-btn {
                background: #3498db;
                color: white;
                border: none;
                width: 38px;
                height: 38px;
                border-radius: 6px;
                cursor: pointer;
                font-size: 18px;
                font-weight: bold;
                display: flex;
                align-items: center;
                justify-content: center;
                flex-shrink: 0;
            }
            .action-btn.remove {
                background: #e74c3c;
            }
            .action-btn.add {
                background: #2ecc71;
            }
            .checkbox-group {
                display: flex;
                align-items: center;
                gap: 8px;
            }
            .checkbox-group input {
                width: 18px;
                height: 18px;
            }
            button.submit-btn {
                width: 100%;
                padding: 12px;
                background: #2ecc71;
                color: white;
                border: none;
                border-radius: 6px;
                font-size: 18px;
                font-weight: 700;
                cursor: pointer;
                margin-top: 15px;
            }
            button.submit-btn:hover {
                background: #27ae60;
            }
            button.cancel-edit-btn {
                width: 100%;
                padding: 8px;
                background: #e74c3c;
                color: white;
                border: none;
                border-radius: 6px;
                font-size: 15px;
                cursor: pointer;
                margin-top: 8px;
                display: none;
            }
            #status-message {
                margin-top: 15px;
                text-align: center;
                font-weight: 600;
            }
            .items-list {
                margin-top: 20px;
                border-top: 2px solid #eee;
                padding-top: 20px;
            }
            .item-card {
                display: flex;
                justify-content: space-between;
                align-items: center;
                background: #f9f9f9;
                padding: 12px 15px;
                border-radius: 8px;
                margin-bottom: 10px;
                border: 1px solid #e5e5e5;
            }
            .item-info {
                display: flex;
                align-items: center;
                gap: 12px;
            }
            .item-info img {
                width: 45px;
                height: 45px;
                object-fit: cover;
                border-radius: 6px;
            }
            .item-actions {
                display: flex;
                gap: 8px;
            }
            .edit-item-btn {
                background: #f39c12;
                color: white;
                border: none;
                padding: 6px 12px;
                border-radius: 5px;
                cursor: pointer;
                font-weight: 600;
            }
            .delete-item-btn {
                background: #e74c3c;
                color: white;
                border: none;
                padding: 6px 12px;
                border-radius: 5px;
                cursor: pointer;
                font-weight: 600;
            }
            .image-preview-container {
                margin-top: 8px;
                display: flex;
                align-items: center;
                gap: 10px;
            }
            .image-preview-container img {
                width: 50px;
                height: 50px;
                object-fit: cover;
                border-radius: 6px;
                border: 1px solid #ccc;
                display: none;
            }
        </style>
    </head>
    <body>
        <div class="admin-container">
            <h1>ניהול מוצרים ומתכונים</h1>

            <!-- מסך התחברות -->
            <div
                id="login-overlay"
                style="
                    position: fixed;
                    top: 0;
                    left: 0;
                    width: 100%;
                    height: 100%;
                    background: #fff;
                    z-index: 9999;
                    display: flex;
                    flex-direction: column;
                    align-items: center;
                    justify-content: center;
                "
            >
                <div style="width: 280px; text-align: center">
                    <h3 style="margin-bottom: 15px; color: #2c3e50">כניסת מנהלת</h3>
                    <div style="position: relative; margin-bottom: 10px">
                        <input type="password" id="admin-pass" placeholder="הקלידי סיסמת ניהול" style="padding: 10px 40px 10px 10px; width: 100%; border: 1px solid #ddd; border-radius: 6px" />
                        <span
                            onclick="togglePasswordVisibility()"
                            style="position: absolute; left: 10px; top: 50%; transform: translateY(-50%); cursor: pointer; font-size: 18px; user-select: none"
                            title="הצג/הסתר סיסמה"
                            ><i class="fa-solid fa-eye"></i
                        ></span>
                    </div>
                    <button
                        id="login-btn"
                        onclick="checkAccess()"
                        style="padding: 10px 20px; width: 100%; background: #3498db; color: #fff; border: none; border-radius: 6px; font-weight: bold; cursor: pointer"
                    >
                        התחברי
                    </button>
                    <div id="login-status" style="margin-top: 12px; font-size: 14px; font-weight: 600; min-height: 20px"></div>
                </div>
            </div>

            <div class="tabs">
                <button class="tab-btn active" onclick="switchTab('products')">ניהול מוצרים</button>
                <button class="tab-btn" onclick="switchTab('recipes')">ניהול מתכונים</button>
            </div>

            <!-- טופס מוצרים -->
            <div id="products-section" class="form-section active">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px">
                    <h3 id="product-form-title" style="color: #34495e; margin: 0">הוספת מוצר חדש</h3>
                    <button
                        type="button"
                        onclick="cancelEdit('products')"
                        style="background: #95a5a6; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-size: 13px"
                    >
                        🔄 נקה טופס
                    </button>
                </div>
                <form id="product-form" onsubmit="saveItem(event, 'products')">
                    <input type="hidden" id="prod-edit-id" />
                    <input type="hidden" id="prod-existing-image" />

                    <div class="form-group">
                        <label>שם המוצר</label>
                        <input type="text" id="prod-name" required />
                    </div>
                    <div class="form-group">
                        <label>תיאור</label>
                        <textarea id="prod-desc" required></textarea>
                    </div>
                    <div class="form-group">
                        <label>מחיר (לדוגמה: 85₪)</label>
                        <input type="text" id="prod-price" required />
                    </div>
                    <div class="form-group">
                        <label>העלאת תמונה (השאירי ריק אם תרצי לשמור על הקיימת)</label>
                        <input type="file" id="prod-img" accept="image/*" />
                        <div class="image-preview-container">
                            <img id="prod-preview" alt="תמונה קיימת" />
                            <span id="prod-preview-text" style="font-size: 13px; color: #7f8c8d; display: none">תמונה קיימת שמורה במערכת</span>
                        </div>
                    </div>
                    <div class="form-group checkbox-group">
                        <input type="checkbox" id="prod-stock" checked />
                        <label for="prod-stock">במלאי</label>
                    </div>
                    <button type="submit" id="prod-submit-btn" class="submit-btn">שמור מוצר</button>
                    <button type="button" id="prod-cancel-btn" class="cancel-edit-btn" onclick="cancelEdit('products')">ביטול עריכה</button>
                </form>

                <div class="items-list">
                    <h4 style="margin-bottom: 10px">מוצרים קיימים:</h4>
                    <div id="products-list-container">טוען מוצרים...</div>
                </div>
            </div>

            <!-- טופס מתכונים -->
            <div id="recipes-section" class="form-section">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px">
                    <h3 id="recipe-form-title" style="color: #34495e; margin: 0">הוספת מתכון חדש</h3>
                    <button
                        type="button"
                        onclick="cancelEdit('recipes')"
                        style="background: #95a5a6; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-size: 13px"
                    >
                        🔄 נקה טופס
                    </button>
                </div>
                <form id="recipe-form" onsubmit="saveItem(event, 'recipes')">
                    <input type="hidden" id="rec-edit-id" />
                    <input type="hidden" id="rec-existing-image" />

                    <div class="form-group">
                        <label>שם המתכון</label>
                        <input type="text" id="rec-title" required />
                    </div>
                    <div class="form-group">
                        <label>העלאת תמונה (השאירי ריק אם תרצי לשמור על הקיימת)</label>
                        <input type="file" id="rec-img" accept="image/*" />
                        <div class="image-preview-container">
                            <img id="rec-preview" alt="תמונה קיימת" />
                            <span id="rec-preview-text" style="font-size: 13px; color: #7f8c8d; display: none">תמונה קיימת שמורה במערכת</span>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>מצרכים</label>
                        <div id="ingredients-container">
                            <div class="ingredient-row">
                                <input type="text" class="ingredient-input" placeholder='לדוגמה: 500 מ"ל שמנת מתוקה' required />
                                <button type="button" class="action-btn add" onclick="addIngredientRow(this)" title="הוסף שורה">+</button>
                            </div>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>אופן הכנה</label>
                        <textarea id="rec-instructions" required></textarea>
                    </div>
                    <button type="submit" id="rec-submit-btn" class="submit-btn">שמור מתכון</button>
                    <button type="button" id="rec-cancel-btn" class="cancel-edit-btn" onclick="cancelEdit('recipes')">ביטול עריכה</button>
                </form>

                <div class="items-list">
                    <h4 style="margin-bottom: 10px">מתכונים קיימים:</h4>
                    <div id="recipes-list-container">טוען מתכונים...</div>
                </div>
            </div>

            <div id="status-message"></div>
        </div>

        <script>
            const GOOGLE_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzEgmH6sMzqS_7coZhC_1kmiNc1FuxrWjpIeo87PYjukjr6p4uXHLBq41k_-R8Qlc9B/exec";

            let currentItemsCache = { products: [], recipes: [] };

            function togglePasswordVisibility() {
                const passInput = document.getElementById("admin-pass");
                if (passInput.type === "password") {
                    passInput.type = "text";
                } else {
                    passInput.type = "password";
                }
            }

            async function checkAccess() {
                const pass = document.getElementById("admin-pass").value;
                const statusMsg = document.getElementById("login-status");
                const loginBtn = document.getElementById("login-btn");

                if (!pass) {
                    statusMsg.style.color = "#e74c3c";
                    statusMsg.textContent = "נא להקליד סיסמה";
                    return;
                }

                loginBtn.disabled = true;
                loginBtn.style.opacity = "0.6";
                statusMsg.style.color = "#3498db";
                statusMsg.textContent = "⏳ מאמת סיסמה מול השרת...";

                try {
                    let response = await fetch(GOOGLE_WEB_APP_URL, {
                        method: "POST",
                        body: JSON.stringify({ action: "verify", password: pass }),
                    });
                    let result = await response.text();

                    if (result.includes("Unauthorized Access")) {
                        statusMsg.style.color = "#e74c3c";
                        statusMsg.textContent = "❌ סיסמה שגויה, נסי שוב.";
                        loginBtn.disabled = false;
                        loginBtn.style.opacity = "1";
                        return;
                    }

                    statusMsg.style.color = "#2ecc71";
                    statusMsg.textContent = "✔ התחברת בהצלחה!";

                    sessionStorage.setItem("admin_pass", pass);

                    setTimeout(() => {
                        document.getElementById("login-overlay").style.display = "none";
                    }, 500);
                } catch (err) {
                    statusMsg.style.color = "#e74c3c";
                    statusMsg.textContent = "⚠ שגיאת תקשורת מול השרת.";
                    loginBtn.disabled = false;
                    loginBtn.style.opacity = "1";
                }
            }

            async function sendDataToServer(payload) {
                payload.password = sessionStorage.getItem("admin_pass") || "";

                const jsonPayload = JSON.stringify(payload);
                console.log("מכין שליחה לשרת. גודל ה-Payload הכולל (בתווים):", jsonPayload.length);

                try {
                    let response = await fetch(GOOGLE_WEB_APP_URL, {
                        method: "POST",
                        headers: {
                            "Content-Type": "text/plain;charset=utf-8",
                        },
                        body: jsonPayload,
                    });

                    console.log("סטטוס HTTP מהשרת:", response.status, response.statusText);
                    let resultText = await response.text();
                    console.log("תשובה גולמית מהשרת:", resultText);

                    if (resultText.startsWith("Error") || response.status !== 200) {
                        alert("שגיאה מהשרת: " + resultText);
                        return false;
                    }

                    return true;
                } catch (error) {
                    console.error("שגיאת הרשת המלאה (Network Error):", error);
                    alert("שגיאת רשת מפורטת: " + error.message + "\n(כנראה שהתמונה גדולה מדי או שהשרת חסם את הבקשה)");
                    return false;
                }
            }

            window.onload = () => {
                loadItemsList("products");
                loadItemsList("recipes");
            };

            function switchTab(tab) {
                document.querySelectorAll(".tab-btn").forEach((btn) => btn.classList.remove("active"));
                document.querySelectorAll(".form-section").forEach((sec) => sec.classList.remove("active"));

                if (tab === "products") {
                    document.querySelectorAll(".tab-btn")[0].classList.add("active");
                    document.getElementById("products-section").classList.add("active");
                } else {
                    document.querySelectorAll(".tab-btn")[1].classList.add("active");
                    document.getElementById("recipes-section").classList.add("active");
                }
            }

            async function loadItemsList(type) {
    // type יכול להיות "products" או "recipes"
    const isRecipes = (type === "recipes" || type === "recipe");
    const serverType = isRecipes ? "recipe" : "product";
    
    const containerId = isRecipes ? "recipes-list-container" : "products-list-container";
    const container = document.getElementById(containerId);
    if (!container) return;

    try {
        const response = await fetch(`${GOOGLE_WEB_APP_URL}?type=${serverType}&t=${Date.now()}`);
        const result = await response.json();

        const items = Array.isArray(result) ? result : result.data || [];
        currentItemsCache[type] = items;

        if (!items || items.length === 0) {
            container.innerHTML = "אין פריטים עדיין.";
            return;
        }

        container.innerHTML = "";
        items.forEach((item) => {
            const itemName = isRecipes ? item.title : item.name;
            const card = document.createElement("div");
            card.className = "item-card";
            card.innerHTML = `
                <div class="item-info">
                    ${item.image ? `<img src="${item.image}" onerror="this.src='https://via.placeholder.com/45'">` : ""}
                    <span><strong>${itemName}</strong></span>
                </div>
                <div class="item-actions">
                    <button class="edit-item-btn" type="button" onclick='prepareEditById("${type}", "${item.id}")'>עריכה</button>
                    <button class="delete-item-btn" type="button" onclick='deleteItem("${type}", "${item.id}")'>מחיקה</button>
                </div>
            `;
            container.appendChild(card);
        });
    } catch (err) {
        console.error("שגיאה בטעינת הרשימה:", err);
        container.innerHTML = "שגיאה בטעינת הרשימה.";
    }
}

            function prepareEditById(type, id) {
                const item = currentItemsCache[type].find((i) => String(i.id) === String(id));
                if (item) {
                    prepareEdit(type, item);
                }
            }

            function addIngredientRow(button, value = "") {
                button.className = "action-btn remove";
                button.textContent = "-";
                button.setAttribute("onclick", "removeIngredientRow(this)");

                const container = document.getElementById("ingredients-container");
                const newRow = document.createElement("div");
                newRow.className = "ingredient-row";
                newRow.innerHTML = `
                <input type="text" class="ingredient-input" value="${value}" placeholder="הכנס מצרך נוסף">
                <button type="button" class="action-btn add" onclick="addIngredientRow(this)" title="הוסף שורה">+</button>
            `;
                container.appendChild(newRow);
            }

            function removeIngredientRow(button) {
                button.parentElement.remove();
            }

            function prepareEdit(type, item) {
                if (type === "products") {
                    document.getElementById("prod-edit-id").value = item.id;
                    document.getElementById("prod-name").value = item.name;
                    document.getElementById("prod-desc").value = item.description;
                    document.getElementById("prod-price").value = item.price;
                    document.getElementById("prod-existing-image").value = item.image || "";
                    document.getElementById("prod-img").value = "";
                    document.getElementById("prod-stock").checked = item.inStock;

                    // הצגת התמונה הקיימת בתצוגה המקדימה
                    const previewImg = document.getElementById("prod-preview");
                    const previewText = document.getElementById("prod-preview-text");
                    if (item.image) {
                        previewImg.src = item.image;
                        previewImg.style.display = "block";
                        previewText.style.display = "inline";
                    } else {
                        previewImg.style.display = "none";
                        previewText.style.display = "none";
                    }

                    document.getElementById("product-form-title").textContent = "עריכת מוצר קיים";
                    document.getElementById("prod-submit-btn").textContent = "עדכן מוצר";
                    document.getElementById("prod-cancel-btn").style.display = "block";
                } else {
                    document.getElementById("rec-edit-id").value = item.id;
                    document.getElementById("rec-title").value = item.title;
                    document.getElementById("rec-existing-image").value = item.image || "";
                    document.getElementById("rec-img").value = "";
                    document.getElementById("rec-instructions").value = item.instructions;

                    // הצגת התמונה הקיימת בתצוגה המקדימה
                    const previewImg = document.getElementById("rec-preview");
                    const previewText = document.getElementById("rec-preview-text");
                    if (item.image) {
                        previewImg.src = item.image;
                        previewImg.style.display = "block";
                        previewText.style.display = "inline";
                    } else {
                        previewImg.style.display = "none";
                        previewText.style.display = "none";
                    }

                    const container = document.getElementById("ingredients-container");
                    container.innerHTML = "";
                    if (item.ingredients && item.ingredients.length > 0) {
                        item.ingredients.forEach((ing, index) => {
                            const row = document.createElement("div");
                            row.className = "ingredient-row";
                            const isLast = index === item.ingredients.length - 1;
                            row.innerHTML = `
                            <input type="text" class="ingredient-input" value="${ing}" placeholder="הכנס מצרך">
                            <button type="button" class="action-btn ${isLast ? "add" : "remove"}" onclick="${isLast ? "addIngredientRow(this)" : "removeIngredientRow(this)"}">${isLast ? "+" : "-"}</button>
                        `;
                            container.appendChild(row);
                        });
                    }

                    document.getElementById("recipe-form-title").textContent = "עריכת מתכון קיים";
                    document.getElementById("rec-submit-btn").textContent = "עדכן מתכון";
                    document.getElementById("rec-cancel-btn").style.display = "block";
                }
                window.scrollTo({ top: 0, behavior: "smooth" });
            }

            function cancelEdit(type) {
                if (type === "products") {
                    document.getElementById("product-form").reset();
                    document.getElementById("prod-edit-id").value = "";
                    document.getElementById("prod-existing-image").value = "";
                    document.getElementById("prod-preview").style.display = "none";
                    document.getElementById("prod-preview-text").style.display = "none";
                    document.getElementById("product-form-title").textContent = "הוספת מוצר חדש";
                    document.getElementById("prod-submit-btn").textContent = "שמור מוצר";
                    document.getElementById("prod-cancel-btn").style.display = "none";
                } else {
                    document.getElementById("recipe-form").reset();
                    document.getElementById("rec-edit-id").value = "";
                    document.getElementById("rec-existing-image").value = "";
                    document.getElementById("rec-preview").style.display = "none";
                    document.getElementById("rec-preview-text").style.display = "none";
                    document.getElementById("recipe-form-title").textContent = "הוספת מתכון חדש";
                    document.getElementById("rec-submit-btn").textContent = "שמור מתכון";
                    document.getElementById("rec-cancel-btn").style.display = "none";
                    document.getElementById("ingredients-container").innerHTML = `
                    <div class="ingredient-row">
                        <input type="text" class="ingredient-input" placeholder="לדוגמה: 500 מ&quot;ל שמנת מתוקה" required>
                        <button type="button" class="action-btn add" onclick="addIngredientRow(this)" title="הוסף שורה">+</button>
                    </div>
                `;
                }
            }

            async function deleteItem(type, id) {
                if (!confirm("האם את בטוחה שאת רוצה למחוק את הפריט?")) return;
                const statusDiv = document.getElementById("status-message");
                statusDiv.style.color = "#333";
                statusDiv.textContent = "מוחק פריט...";

                let success = await sendDataToServer({
                    action: "delete",
                    type: type === "recipes" ? "recipe" : "product",
                    id: id,
                });

                if (success) {
                    statusDiv.style.color = "green";
                    statusDiv.textContent = "הפריט נמחק בהצלחה!";
                    loadItemsList(type);
                } else {
                    statusDiv.style.color = "red";
                    statusDiv.textContent = "שגיאה במחיקה.";
                }
            }

            function convertFileToBase64(file) {
                return new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.readAsDataURL(file);
                    reader.onload = (event) => {
                        const img = new Image();
                        img.src = event.target.result;
                        img.onload = () => {
                            const canvas = document.createElement("canvas");

                            // נשארים בבטחה על 400 פיקסלים כדי שהשרת של גוגל לא יחנק לעולם
                            const MAX_WIDTH = 400;
                            const MAX_HEIGHT = 400;
                            let width = img.width;
                            let height = img.height;

                            if (width > height) {
                                if (width > MAX_WIDTH) {
                                    height *= MAX_WIDTH / width;
                                    width = MAX_WIDTH;
                                }
                            } else {
                                if (height > MAX_HEIGHT) {
                                    width *= MAX_HEIGHT / height;
                                    height = MAX_HEIGHT;
                                }
                            }

                            canvas.width = width;
                            canvas.height = height;
                            const ctx = canvas.getContext("2d");

                            ctx.imageSmoothingEnabled = true;
                            ctx.imageSmoothingQuality = "high";
                            ctx.drawImage(img, 0, 0, width, height);

                            // JPEG באיכות 0.7 על 400 פיקסלים – שומר על גודל קטן ובטוח, אבל נותן חדות טובה יותר מקודמו
                            const compressedDataUrl = canvas.toDataURL("image/jpeg", 0.7);

                            console.log("גודל תמונה בטוח ומקסימלי (בתווים):", compressedDataUrl.length);
                            resolve(compressedDataUrl);
                        };
                        img.onerror = (error) => reject(error);
                    };
                    reader.onerror = (error) => reject(error);
                });
            }

            async function saveItem(event, type) {
                event.preventDefault();
                const statusDiv = document.getElementById("status-message");
                statusDiv.style.color = "#333";
                statusDiv.textContent = "שומר נתונים ל-Google Sheets...";

                try {
                    const isRecipes = type === "recipes";
                    const editId = document.getElementById(isRecipes ? "rec-edit-id" : "prod-edit-id").value;
                    const existingImage = document.getElementById(isRecipes ? "rec-existing-image" : "prod-existing-image").value;
                    const fileInput = document.getElementById(isRecipes ? "rec-img" : "prod-img");

                    let imageVal = existingImage;
                    if (fileInput.files && fileInput.files[0]) {
                        imageVal = await convertFileToBase64(fileInput.files[0]);
                    }

                    const isEditing = editId !== "";
                    const id = isEditing ? editId : Date.now();

                    let payload = {
                        action: isEditing ? "update" : "add",
                        type: isRecipes ? "recipe" : "product",
                        id: id,
                        image: imageVal,
                    };

                    if (isRecipes) {
                        const ingredients = Array.from(document.querySelectorAll(".ingredient-input"))
                            .map((input) => input.value.trim())
                            .filter((v) => v !== "");
                        payload.title = document.getElementById("rec-title").value;
                        payload.ingredients = ingredients;
                        payload.instructions = document.getElementById("rec-instructions").value;
                    } else {
                        payload.name = document.getElementById("prod-name").value;
                        payload.description = document.getElementById("prod-desc").value;
                        payload.price = document.getElementById("prod-price").value;
                        payload.inStock = document.getElementById("prod-stock").checked;
                    }

                    let success = await sendDataToServer(payload);

                    if (success) {
                        statusDiv.style.color = "green";
                        statusDiv.textContent = isEditing ? "הפריט עודכן בהצלחה! ✨" : "הפריט נוסף בהצלחה! ✨";
                        cancelEdit(type);
                        loadItemsList(type);
                    } else {
                        cancelEdit(type);
                        statusDiv.style.color = "red";
                        statusDiv.textContent = "שגיאה בשמירה (הטופס אופס כדי שתוכלי לנסות שוב).";
                    }
                } catch (error) {
                    cancelEdit(type);
                    statusDiv.style.color = "red";
                    statusDiv.textContent = "שגיאה בשמירה.";
                }
            }
        </script>
    </body>
</html>
