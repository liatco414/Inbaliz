<!doctype html>
<html lang="he" dir="rtl">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>מתכון | Inbali'z</title>
        <link rel="stylesheet" href="recipes.css" />
        <link rel="stylesheet" href="style.css" />
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    </head>
    <body>
        <!-- תפריט ניווט עליון עם כפתור חזרה בלבד -->
        <nav class="navbar scrolled recipe-nav">
            <div class="nav-brand">
                <a href="index.html"><img src="./images/natural-sticker.png" alt="Logo" class="nav-logo" /></a>
            </div>
            <div class="nav-links">
                <a href="recipes.html"><i class="fa-solid fa-arrow-right"></i> חזרה לכל המתכונים</a>
            </div>
        </nav>

        <!-- תוכן המתכון הבודד -->
        <main class="recipe-detail-page">
            <div class="container" id="recipeContainer">
                <!-- הצגת הספינר האחיד של האתר בזמן הטעינה -->
                <div class="loading-spinner-container">
                    <div class="loading-spinner"></div>
                    <p>טוען את המתכון...</p>
                </div>
            </div>
        </main>

        <!-- פוטר -->
        <footer class="main-footer">
            <div class="footer-content">
                <div class="footer-bottom">
                    <p>יוצרת האתר ליאת | liatco109@gmail.com <i class="fa-regular fa-envelope"></i></p>
                </div>
            </div>
        </footer>

        <script>
            const GOOGLE_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwS9QYu0O14wphSAXOX-wDLpEmhflUYDS8j1yuEgDsuXf_wiiUBrXGjR0K9kYzhxfcu/exec";

            document.addEventListener("DOMContentLoaded", () => {
                const urlParams = new URLSearchParams(window.location.search);
                const recipeId = urlParams.get("id");
                const container = document.getElementById("recipeContainer");

                fetch(`${GOOGLE_WEB_APP_URL}?type=recipe`)
                    .then((response) => response.json())
                    .then((result) => {
                        const recipes = result.data || [];
                        const recipe = recipes.find((r) => r.id == recipeId);

                        if (!recipe) {
                            container.innerHTML = `<h2>המתכון המבוקש לא נמצא</h2><br><a href="recipes.html" class="hero-btn">חזרה למתכונים</a>`;
                            return;
                        }

                        const ingredientsArray = Array.isArray(recipe.ingredients) ? recipe.ingredients : recipe.ingredients ? recipe.ingredients.split(",") : [];
                        const ingredientsHTML = ingredientsArray.map((item) => `<li>${item.trim()}</li>`).join("");

                        container.innerHTML = `
                            <div class="recipe-single-wrapper">
                                <div class="recipe-single-img">
                                    <img src="${recipe.image || "images/placeholder.jpg"}" alt="${recipe.title}">
                                </div>
                                <div class="recipe-single-content">
                                    <h1 class="recipe-single-title">${recipe.title}</h1>
                                    
                                    <div class="recipe-section-box">
                                        <h3>מצרכים:</h3>
                                        <ul class="recipe-ingredients-list">
                                            ${ingredientsHTML}
                                        </ul>
                                    </div>

                                    <div class="recipe-section-box">
                                        <h3>אופן הכנה:</h3>
                                        <p class="recipe-instructions-text">${recipe.instructions}</p>
                                    </div>
                                </div>
                            </div>
                        `;
                    })
                    .catch((error) => {
                        console.error("שגיאה בטעינת פרטי המתכון:", error);
                        container.innerHTML = `<p style="text-align: center; color: #666;">אירעה שגיאה בטעינת המתכון. נסי לרענן את הדף.</p>`;
                    });
            });
        </script>
    </body>
</html>
