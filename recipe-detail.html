<!doctype html>
<html lang="he" dir="rtl">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>מתכון | Inbali'z</title>
        <link rel="stylesheet" href="recipes.css" />
        <link rel="stylesheet" href="style.css" />
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    </head>
    <body>
        <!-- תפריט ניווט עליון עם כפתור חזרה בלבד -->
        <!-- דף המתכון: תגית ה-nav צריכה להיראות כך -->
        <nav class="navbar scrolled recipe-nav">
            <div class="nav-brand">
                <a href="index.html"><img src="./images/natural-sticker.png" alt="Logo" class="nav-logo" /></a>
            </div>
            <div class="nav-links">
                <a href="recipes.html"><i class="fa-solid fa-arrow-right"></i> חזרה לכל המתכונים</a>
            </div>
        </nav>
        <!-- תוכן המתכון הבודד -->
        <main class="recipe-detail-page">
            <div class="container" id="recipeContainer">
                <!-- יטען דינמית באמצעות JavaScript לפי ה-ID -->
                <p class="loading-text">טוען את המתכון...</p>
            </div>
        </main>

        <!-- פוטר -->
        <footer class="main-footer">
            <div class="footer-content">
                <div class="footer-bottom">
                    <p>יוצרת האתר ליאת | liatco109@gmail.com <i class="fa-regular fa-envelope"></i></p>
                </div>
            </div>
        </footer>

        <script>
            const GOOGLE_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxs41gKQuTUlxTr0x7y1HT19QmK7Kiw_F0gYUbXQjZJJytOf_IhJSlBm44-OD5As3xE/exec";

            document.addEventListener("DOMContentLoaded", () => {
                const urlParams = new URLSearchParams(window.location.search);
                const recipeId = urlParams.get("id");
                const container = document.getElementById("recipeContainer");

                fetch(`${GOOGLE_WEB_APP_URL}?type=recipe`)
                    .then((response) => response.json())
                    .then((recipes) => {
                        const recipe = recipes.find((r) => r.id == recipeId);

                        if (!recipe) {
                            container.innerHTML = `<h2>המתכון המבוקש לא נמצא</h2><br><a href="recipes.html" class="hero-btn">חזרה למתכונים</a>`;
                            return;
                        }

                        const ingredientsHTML = (recipe.ingredients || []).map((item) => `<li>${item}</li>`).join("");

                        container.innerHTML = `
                        <div class="recipe-single-wrapper">
                            <div class="recipe-single-img">
                                <img src="${recipe.image || "https://via.placeholder.com/600x400"}" alt="${recipe.title}">
                            </div>
                            <div class="recipe-single-content">
                                <h1 class="recipe-single-title">${recipe.title}</h1>
                                
                                <div class="recipe-section-box">
                                    <h3>מצרכים:</h3>
                                    <ul class="recipe-ingredients-list">
                                        ${ingredientsHTML}
                                    </ul>
                                </div>

                                <div class="recipe-section-box">
                                    <h3>אופן הכנה:</h3>
                                    <p class="recipe-instructions-text">${recipe.instructions}</p>
                                </div>
                            </div>
                        </div>
                    `;
                    })
                    .catch((error) => {
                        console.error("שגיאה בטעינת פרטי המתכון:", error);
                        container.innerHTML = `<p>אירעה שגיאה בטעינת המתכון.</p>`;
                    });
            });
        </script>
    </body>
</html>
