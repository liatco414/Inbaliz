backend:
    name: git-gateway
    branch: main

media_folder: "images" # איפה התמונות יישמרו
public_folder: "/images"

collections:
    # אוסף המתכונים
    - name: "recipes"
      label: "מתכונים"
      folder: "data/recipes" # מומלץ לשמור כל מתכון כקובץ JSON נפרד
      create: true
      slug: "{{slug}}"
      fields:
          - { label: "שם המתכון", name: "title", widget: "string" }
          - { label: "תמונה", name: "image", widget: "image" }
          - { label: "מצרכים", name: "ingredients", widget: "list" }
          - { label: "אופן הכנה", name: "instructions", widget: "text" }

    # אוסף המוצרים
    - name: "bakery_items"
      label: "מוצרים בתפריט"
      folder: "data/products"
      create: true
      slug: "{{slug}}"
      fields:
          - { label: "שם המוצר", name: "name", widget: "string" }
          - { label: "תיאור", name: "description", widget: "text" }
          - { label: "מחיר", name: "price", widget: "string" }
          - { label: "תמונה", name: "image", widget: "image" }
          - { label: "במלאי", name: "inStock", widget: "boolean" }
